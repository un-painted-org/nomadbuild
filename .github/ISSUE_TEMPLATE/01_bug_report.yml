name: Bug Report
description: Report a bug or unexpected behavior in NomadBuild
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us diagnose and fix the issue.
        
        Note: Issues are not for general support, configuration, or discussion. For those topics, please consult the documentation or join the Bitaxe community Discord.
  
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you've completed the following steps before submitting your issue.
      options:
        - label: I have searched the existing issues to make sure this is not a duplicate
          required: true
        - label: I have updated to the latest version of NomadBuild
          required: true
        - label: I have read the documentation
          required: true
  
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: When I try to build firmware, the process fails with an error message...
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: The firmware should build successfully and show a success message.
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Linux
        - macOS
        - Windows with WSL
        - Windows with Docker Desktop
        - Other (specify in additional information)
    validations:
      required: true
  
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      description: Which interface were you using when the bug occurred?
      options:
        - Web UI
        - Command Line (CLI)
        - Both
    validations:
      required: true
  
  - type: input
    id: docker
    attributes:
      label: Docker Version
      description: What version of Docker are you using? (Run `docker --version` to check)
      placeholder: Docker version 24.0.6, build ed223bc
  
  - type: input
    id: nomadbuild
    attributes:
      label: NomadBuild Version
      description: What version of NomadBuild are you using?
      placeholder: v1.0.0 or commit hash
    validations:
      required: true
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other context about the problem here, including screenshots if applicable.
